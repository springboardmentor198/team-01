spring.application.name=due-diligence-agent

server.port=${SERVER_PORT:8081}

# PostgreSQL Database
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}}
spring.datasource.username=${DB_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:root}}

# Flyway
spring.flyway.enabled=true

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Authentication and browser access. Set JWT_SECRET outside local development.
jwt.secret=${JWT_SECRET:local-development-secret-change-before-deployment-32-bytes}
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Values loaded from application-local.properties
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:info@example.com}

# Google OAuth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:mock-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:mock-client-secret}
google.redirect.uri=postmessage

# Used by custom service
google.client.id=${GOOGLE_CLIENT_ID:mock-client-id}
google.client.secret=${GOOGLE_CLIENT_SECRET:mock-client-secret}
# ===============================
# ACTUATOR
# ===============================

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

management.metrics.enable.jvm=true
management.metrics.enable.system=true
management.metrics.enable.process=true
management.metrics.enable.http=true

# ===============================
# APPLICATION LOGGING
# ===============================

logging.file.name=logs/due-diligence-agent.log

logging.level.root=INFO
