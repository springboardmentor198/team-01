spring.application.name=due-diligence-agent
spring.profiles.active=local

server.port=8081

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/real_estate_dd
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Flyway / JPA
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Google OAuth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:mock-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:mock-client-secret}
google.redirect.uri=postmessage

# Used by your custom service
google.client.id=${GOOGLE_CLIENT_ID:mock-client-id}
google.client.secret=${GOOGLE_CLIENT_SECRET:mock-client-secret}
