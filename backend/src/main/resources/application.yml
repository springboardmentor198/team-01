jwt:
  secret: ${JWT_SECRET:my-super-secret-key-that-is-long-enough-to-be-secure-32-bytes-long}

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:postgres}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
